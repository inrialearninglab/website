stages:
    - build
    - deploy

variables:
    NODE_VERSION: "24"

cache:
    key:
        files:
            - package-lock.json
    paths:
        - node_modules/

build:
    stage: build
    script:
        - npm ci
        - npm run build
    artifacts:
        paths:
            - dist/

deploy:
    stage: deploy
    script:
        - cp -r dist/ /appli/website
